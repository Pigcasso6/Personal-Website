<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liang Zhu | Portfolio</title>
    
    <!-- Global Error Handler -->
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        console.error("Global Error:", message);
        const root = document.getElementById('root');
        if (root && root.innerHTML === '') {
          // Only show backup error UI if React hasn't mounted
          document.body.innerHTML = `
            <div style="padding: 2rem; font-family: system-ui; color: #333; max-width: 600px; margin: 0 auto;">
              <h2 style="color: #e11d48;">Loading Error</h2>
              <p>The application encountered an issue during startup.</p>
              <pre style="background: #f1f5f9; padding: 1rem; border-radius: 0.5rem; overflow: auto; font-size: 0.875rem;">${message}</pre>
            </div>
          `;
        }
      };
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+JP:wght@400;700&family=Noto+Serif+SC:wght@400;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (CDN for simplicity in layout, though production usually uses build step. Keeping for compatibility with current class names) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              serif: ['Merriweather', 'serif'],
              'sans-sc': ['"Noto Sans SC"', 'sans-serif'],
              'serif-sc': ['"Noto Serif SC"', 'serif'],
              'sans-tc': ['"Noto Sans TC"', 'sans-serif'],
              'serif-tc': ['"Noto Serif TC"', 'serif'],
              'sans-jp': ['"Noto Sans JP"', 'sans-serif'],
              'serif-jp': ['"Noto Serif JP"', 'serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
              'slide-up': 'slideUp 0.6s ease-out',
              'blob': 'blob 7s infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              }
            }
          },
        },
      }
    </script>
    <style>

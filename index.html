
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pigcahome</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/avatar-rounded-square.png">

    <!-- Global Error Handler -->
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        console.error("Global Error:", message);
        const root = document.getElementById('root');
        if (root && root.innerHTML === '') {
          // Only show backup error UI if React hasn't mounted
          document.body.innerHTML = `
            <div style="padding: 2rem; font-family: system-ui; color: #333; max-width: 600px; margin: 0 auto;">
              <h2 style="color: #e11d48;">Loading Error</h2>
              <p>The application encountered an issue during startup.</p>
              <pre style="background: #f1f5f9; padding: 1rem; border-radius: 0.5rem; overflow: auto; font-size: 0.875rem;">${message}</pre>
            </div>
          `;
        }
      };
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+JP:wght@400;700&family=Noto+Serif+SC:wght@400;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (CDN for simplicity in layout, though production usually uses build step. Keeping for compatibility with current class names) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              serif: ['Merriweather', 'serif'],
              'sans-sc': ['"Noto Sans SC"', 'sans-serif'],
              'serif-sc': ['"Noto Serif SC"', 'serif'],
              'sans-tc': ['"Noto Sans TC"', 'sans-serif'],
              'serif-tc': ['"Noto Serif TC"', 'serif'],
              'sans-jp': ['"Noto Sans JP"', 'sans-serif'],
              'serif-jp': ['"Noto Serif JP"', 'serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.4s ease-out',
              'slide-up': 'slideUp 1.35s cubic-bezier(0.16, 1, 0.3, 1) both',
              'blob': 'blob 7s infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translate3d(0, 48px, 0)', opacity: '0', filter: 'blur(8px)' },
                '100%': { transform: 'translate3d(0, 0, 0)', opacity: '1', filter: 'blur(0px)' },
              },
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      html { scroll-behavior: smooth; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      .dark ::-webkit-scrollbar-thumb { background: #475569; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

      /* ==========================================================================
         Apple iOS 26 Liquid Glass Design System
         ========================================================================== */
      .liquid-glass {
        background: rgba(255, 255, 255, 0.68);
        backdrop-filter: blur(28px) saturate(190%) contrast(102%);
        -webkit-backdrop-filter: blur(28px) saturate(190%) contrast(102%);
        border: 1px solid rgba(255, 255, 255, 0.65);
        box-shadow: 
          0 20px 40px -15px rgba(0, 0, 0, 0.06),
          0 1px 3px 0 rgba(0, 0, 0, 0.02),
          inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.85),
          inset 0 -1px 1px 0 rgba(0, 0, 0, 0.04);
        position: relative;
      }

      .dark .liquid-glass {
        background: rgba(15, 23, 42, 0.68);
        backdrop-filter: blur(28px) saturate(190%) contrast(102%);
        -webkit-backdrop-filter: blur(28px) saturate(190%) contrast(102%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 
          0 25px 50px -15px rgba(0, 0, 0, 0.45),
          0 1px 3px 0 rgba(0, 0, 0, 0.2),
          inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.25),
          inset 0 -1px 1px 0 rgba(0, 0, 0, 0.45);
      }

      .liquid-glass-interactive {
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .liquid-glass-interactive:hover {
        background: rgba(255, 255, 255, 0.82);
        border-color: rgba(255, 255, 255, 0.95);
        box-shadow: 
          0 30px 60px -15px rgba(99, 102, 241, 0.14),
          0 2px 6px 0 rgba(0, 0, 0, 0.03),
          inset 0 2px 1.5px 0 rgba(255, 255, 255, 0.95),
          inset 0 -1px 1px 0 rgba(0, 0, 0, 0.03);
        transform: translateY(-2px);
      }

      .dark .liquid-glass-interactive:hover {
        background: rgba(24, 34, 60, 0.76);
        border-color: rgba(255, 255, 255, 0.22);
        box-shadow: 
          0 35px 70px -15px rgba(99, 102, 241, 0.25),
          0 2px 6px 0 rgba(0, 0, 0, 0.3),
          inset 0 2px 1.5px 0 rgba(255, 255, 255, 0.35),
          inset 0 -1px 1px 0 rgba(0, 0, 0, 0.4);
        transform: translateY(-2px);
      }

      /* Liquid Glass Navigation Pill */
      .liquid-nav-capsule {
        transition: width 1s cubic-bezier(0.16, 1, 0.3, 1),
                    max-width 1s cubic-bezier(0.16, 1, 0.3, 1),
                    padding 1s cubic-bezier(0.16, 1, 0.3, 1),
                    background-color 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                    border-color 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                    box-shadow 1s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: width, max-width;
      }

      .liquid-nav {
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(32px) saturate(200%) contrast(104%);
        -webkit-backdrop-filter: blur(32px) saturate(200%) contrast(104%);
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: 
          0 10px 30px -10px rgba(0, 0, 0, 0.08),
          inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.9),
          inset 0 -1px 1px 0 rgba(0, 0, 0, 0.03);
      }

      .dark .liquid-nav {
        background: rgba(15, 23, 42, 0.72);
        backdrop-filter: blur(32px) saturate(200%) contrast(104%);
        -webkit-backdrop-filter: blur(32px) saturate(200%) contrast(104%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 
          0 15px 35px -10px rgba(0, 0, 0, 0.5),
          inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.22),
          inset 0 -1px 1px 0 rgba(0, 0, 0, 0.4);
      }

      /* Liquid Light Sheen */
      .liquid-sheen {
        position: relative;
        overflow: hidden;
      }
      .liquid-sheen::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 48%;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.0) 100%);
        border-radius: inherit;
        pointer-events: none;
      }
      .dark .liquid-sheen::after {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.0) 100%);
      }

      /* Liquid Glass Button */
      .liquid-btn {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.85) 0%, rgba(240, 244, 250, 0.75) 100%);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 
          0 6px 18px -4px rgba(0, 0, 0, 0.08),
          inset 0 1.5px 1px 0 rgba(255, 255, 255, 1),
          inset 0 -1px 1px 0 rgba(0, 0, 0, 0.05);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .dark .liquid-btn {
        background: linear-gradient(180deg, rgba(30, 41, 59, 0.85) 0%, rgba(15, 23, 42, 0.75) 100%);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 
          0 8px 20px -4px rgba(0, 0, 0, 0.4),
          inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.2),
          inset 0 -1px 1px 0 rgba(0, 0, 0, 0.3);
      }
      .liquid-btn:hover {
        transform: translateY(-1px) scale(1.02);
        box-shadow: 
          0 10px 24px -4px rgba(99, 102, 241, 0.22),
          inset 0 2px 1.5px 0 rgba(255, 255, 255, 1);
      }
      .liquid-btn:active {
        transform: translateY(0.5px) scale(0.98);
      }

      /* Liquid Primary CTA Button */
      .liquid-btn-primary {
        background: linear-gradient(180deg, rgba(79, 70, 229, 0.95) 0%, rgba(67, 56, 202, 0.9) 100%);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(199, 210, 254, 0.45);
        box-shadow: 
          0 12px 28px -6px rgba(79, 70, 229, 0.45),
          inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.5),
          inset 0 -1px 1px 0 rgba(0, 0, 0, 0.25);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .liquid-btn-primary:hover {
        background: linear-gradient(180deg, rgba(99, 102, 241, 0.98) 0%, rgba(79, 70, 229, 0.95) 100%);
        box-shadow: 
          0 16px 36px -6px rgba(79, 70, 229, 0.55),
          inset 0 2px 1.5px 0 rgba(255, 255, 255, 0.7);
        transform: translateY(-1px) scale(1.02);
      }
      .liquid-btn-primary:active {
        transform: translateY(0.5px) scale(0.98);
      }

      /* Liquid Surface Tension Pill */
      .liquid-pill {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(16px) saturate(180%);
        -webkit-backdrop-filter: blur(16px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 
          0 4px 12px -2px rgba(0, 0, 0, 0.05),
          inset 0 1px 1px 0 rgba(255, 255, 255, 0.8);
      }
      .dark .liquid-pill {
        background: rgba(30, 41, 59, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 
          0 4px 12px -2px rgba(0, 0, 0, 0.3),
          inset 0 1px 1px 0 rgba(255, 255, 255, 0.2);
      }

      /* Liquid Progress Track & Fill */
      .liquid-track {
        background: rgba(203, 213, 225, 0.5);
        box-shadow: inset 0 1.5px 3px 0 rgba(0, 0, 0, 0.12);
      }
      .dark .liquid-track {
        background: rgba(30, 41, 59, 0.7);
        box-shadow: inset 0 1.5px 3px 0 rgba(0, 0, 0, 0.35);
      }
      .liquid-fill {
        box-shadow: 
          0 2px 8px 0 rgba(99, 102, 241, 0.35),
          inset 0 1px 1px 0 rgba(255, 255, 255, 0.45);
      }

      @keyframes floatSlow {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(35px, -45px) scale(1.08); }
        66% { transform: translate(-30px, 35px) scale(0.94); }
      }
      @keyframes floatSlowReverse {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(-40px, 30px) scale(1.05); }
        66% { transform: translate(30px, -40px) scale(0.96); }
      }
      .animate-float-slow {
        animation: floatSlow 14s ease-in-out infinite;
      }
      .animate-float-slow-reverse {
        animation: floatSlowReverse 16s ease-in-out infinite;
      }
    </style>
